<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ウォレット — zero-pii demo</title>
  <script type="module" crossorigin src="/assets/wallet-Dh6T5YIF.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/idb-Cxhszwh1.js">
  <link rel="stylesheet" crossorigin href="/assets/idb-CKXwzmWD.css">
</head>
<body>
  <main class="wrap">
    <h1>🗝️ ウォレット</h1>
    <p class="sub">自分の属性証明を保管する場所。パスキーで解錠する。</p>

    <section class="card">
      <h2>1. パスキーで解錠</h2>
      <label>ユーザー名 <input id="username" value="yamada" /></label>
      <div class="row">
        <button id="btn-register">パスキー登録</button>
        <button id="btn-login" class="ghost">ログイン</button>
      </div>
      <p id="auth-status" class="muted">未ログイン</p>
    </section>

    <section class="card">
      <h2>2. eKYC → 証明書発行 <span class="tag">デモではモック</span></h2>
      <p class="muted">
        本来ここで運転免許・マイナンバーの実検証が入ります。デモでは入力値を「確認済み」として扱います。
        このPoCではissuerに生年月日だけを送り、issuerは<b>over20</b>を計算したら正確な生年月日をcredentialにもwalletにも保存しません。
      </p>
      <label>生年月日 <input id="lic-birth" value="1995-04-01" /></label>
      <button id="btn-issue">証明書を発行</button>
    </section>

    <section class="card">
      <h2>3. 保有する証明書</h2>
      <div id="cred-list"></div>
    </section>

    <nav>
      <a href="/shop.html">→ ミニ酒屋で試す</a> ・
      <a href="/api/status-list" target="_blank">失効リストを見る</a>
    </nav>
  </main>
</body>
</html>
